AUTO_RESUME: true
CUDNN:
  BENCHMARK: true
  DETERMINISTIC: false
  ENABLED: true
DATA_DIR: ''
GPUS: (0,)
OUTPUT_DIR: 'output'
LOG_DIR: 'log'
WORKERS: 1
PRINT_FREQ: 20

DATASET:
  COLOR_RGB: true
  DATASET: 'syrip'
  DATA_FORMAT: jpg
  FLIP: true
  NUM_JOINTS_HALF_BODY: 8
  PROB_HALF_BODY: 0.3
  ROOT: 'data/syrip/'
  ROT_FACTOR: 45
  SCALE_FACTOR: 0.35
  TEST_SET: 'validate_infant'
  TRAIN_SET: 'train_infant'
  TRAIN_PRE_SET: 'train_pre_infant'
MODEL:
  INIT_WEIGHTS: true   # head: normal init; backbone: torchvision ImageNet weights
  NAME: adaptive_pose_cnn
  NUM_JOINTS: 17
  PRETRAINED: ''
  TARGET_TYPE: gaussian
  IMAGE_SIZE:
  - 288
  - 384
  HEATMAP_SIZE:
  - 72
  - 96
  SIGMA: 3
  EXTRA:
    BACKBONE: densenet121
    NUM_DECONV_LAYERS: 3
    NUM_DECONV_FILTERS: 256
LOSS:
  USE_TARGET_WEIGHT: true
TRAIN:
  PRE_BATCH_SIZE_PER_GPU: 16
  BATCH_SIZE_PER_GPU: 20
  CHECKPOINT: ''
  SHUFFLE: true
  PRE_EPOCH: 0
  BEGIN_EPOCH: 0
  END_EPOCH: 20 
  LAMBDA: 0.000
  OPTIMIZER: adam
  LR: 0.0001
  LR_FACTOR: 0.1
  LR_STEP:
  - 40
  - 200
  WD: 0.0001
  GAMMA1: 0.99
  GAMMA2: 0.0
  MOMENTUM: 0.9
  NESTEROV: false
TEST:
  BATCH_SIZE_PER_GPU: 16
  COCO_BBOX_FILE: 'data/coco/person_detection_results/COCO_val2017_detections_AP_H_56_person.json'
  BBOX_THRE: 1.0
  IMAGE_THRE: 0.0
  IN_VIS_THRE: 0.2
  MODEL_FILE: ''
  NMS_THRE: 1.0
  OKS_THRE: 0.9
  USE_GT_BBOX: true
  FLIP_TEST: true
  POST_PROCESS: true
  BLUR_KERNEL: 11
DEBUG:
  DEBUG: true
  SAVE_BATCH_IMAGES_GT: true
  SAVE_BATCH_IMAGES_PRED: true
  SAVE_HEATMAPS_GT: true
  SAVE_HEATMAPS_PRED: true
